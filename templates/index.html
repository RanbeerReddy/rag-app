<!DOCTYPE html>
<html>
<head>
    <title>Debales AI Assistant</title>
    <style>
        body {
            font-family: Arial;
            margin: 40px;
            background-color: #f4f4f4;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            font-size: 16px;
        }

        button {
            margin-top: 10px;
            padding: 10px 15px;
            font-size: 16px;
        }

        .answer {
            margin-top: 20px;
            padding: 10px;
            background: #e8f0fe;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Debales AI Assistant</h2>

    <form method="POST">
        <input type="text" name="query" placeholder="Ask something..." required>
        <button type="submit">Submit</button>
    </form>

    {% if query %}
        <p><strong>Question:</strong> {{ query }}</p>
    {% endif %}

    {% if answer %}
        <div class="answer">
            <strong>Answer:</strong>
            <p>{{ answer }}</p>
        </div>
    {% endif %}
</div>

</body>
</html>
